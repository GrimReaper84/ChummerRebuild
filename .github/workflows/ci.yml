name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Liberica mit JavaFX wie in der Entwicklung und im Release (ADR-043).
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-package: jdk+fx
          java-version: 25
      # v5, nicht v6: v6 hat das Caching in eine Closed-Source-Komponente mit eigenen Nutzungsbedingungen verlagert.
      - uses: gradle/actions/setup-gradle@v5
      - name: Bauen und testen
        run: ./gradlew build
