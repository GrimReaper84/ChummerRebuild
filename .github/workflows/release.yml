name: Release

# Ein Tag wie v0.1.0 baut auf jedem Betriebssystem Installer und portables ZIP und hängt sie an einen Release-Entwurf.
# Von Hand gestartet (Actions -> Release -> Run workflow) entstehen die Pakete nur als Workflow-Artefakte.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Das .deb hängt von den Systembibliotheken der Build-Maschine ab; die Paketnamen von 22.04 gibt es auch
          # in neueren Ubuntu-Versionen und in Debian 12.
          - os: ubuntu-22.04
            installer: build/jpackage/*.deb
          - os: windows-2022
            installer: build/jpackage/*.msi
          # Apple Silicon (arm64).
          - os: macos-latest
            installer: build/jpackage/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # JavaFX kommt als Module aus der JDK ins Laufzeit-Image, daher Liberica mit JavaFX (ADR-043).
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-package: jdk+fx
          java-version: 25
      # v5, nicht v6: v6 hat das Caching in eine Closed-Source-Komponente mit eigenen Nutzungsbedingungen verlagert.
      - uses: gradle/actions/setup-gradle@v5

      - name: Prüfen, ob der Tag zur Version in gradle.properties passt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version in gradle.properties" >&2
            exit 1
          fi

      # jpackage braucht für MSI-Installer das WiX Toolset; Version 3 wird installiert, falls sie fehlt (JDK 25
      # akzeptiert auch WiX 4/5, falls das Runner-Image Version 3 einmal nicht mehr anbietet).
      - name: WiX Toolset 3 bereitstellen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset --version 3.14.1 -y --no-progress
              $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -First 1
            }
            if (-not $wix) { throw 'WiX Toolset 3 nach der Installation nicht gefunden' }
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      # Nur die JDK aus setup-java verwenden: Eine vorinstallierte JDK 25 ohne JavaFX ergäbe ein Image, das nicht startet
      # (jlink bricht dann wegen der festen Modulliste ab).
      - name: Bauen, testen und paketieren
        run: >
          ./gradlew build jpackage runtimeZip
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            ${{ matrix.installer }}
            build/portable/*.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          # Die Artefakte behalten ihre Ordner (jpackage/, portable/), daher Dateien in Unterordnern einschließen.
          files: dist/**/*
          fail_on_unmatched_files: true
